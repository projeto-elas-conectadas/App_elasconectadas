services:
  db:
    image: mysql:8.0
    cap_add:
      - SYS_NICE
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    # Opcional: no desenvolvimento padrão, apenas o MySQL roda no Docker.
    # Para executar também o backend no container, use o perfil full-stack.
    profiles:
      - full-stack
    image: node:20
    working_dir: /app
    restart: always
    volumes:
      - ./Elas_Conectadas_BackEnd:/app
      # Mantém dependências Linux do container fora do node_modules do Windows.
      - backend_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
    command: sh -c "yarn install && npx prisma generate && yarn build && yarn start:prod"

volumes:
  db_data:
  backend_node_modules:
