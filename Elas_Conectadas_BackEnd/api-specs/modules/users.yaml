paths:
  /users/register:
    post:
      summary: Registra uma nova usuária
      operationId: UsersController_createUser
      tags:
        - Users
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: Usuária registrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '400':
          description: Erro de validação dos dados enviados

  /users/admin:
    post:
      summary: Cria uma conta de administradora
      operationId: UsersController_createAdmin
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminDto'
      responses:
        '201':
          description: Admin registrado com sucesso
          content:
            application/json:
              schema:
                type: object

  /users:
    get:
      summary: Lista todas as usuárias
      operationId: UsersController_getUsers
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuárias retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDto'

  /users/{id}:
    get:
      summary: Busca uma usuária por ID
      operationId: UsersController_getUserById
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Dados da usuária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
    patch:
      summary: Atualiza os dados da usuária
      operationId: UsersController_updateUserById
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: Usuária atualizada
          content:
            application/json:
              schema:
                type: object
        '400':
          description: "Corpo inválido (ex.: pfp que não é URI)"
    delete:
      summary: Remove uma usuária
      operationId: UsersController_deleteUserById
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Usuária removida
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    UserResponseDto:
      type: object
      required:
        - id
        - email
        - name
        - role
        - accountStatus
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
          nullable: true
        dob:
          type: string
          nullable: true
          description: "Data de nascimento no formato DD/MM/AAAA"
        occupation:
          type: string
          nullable: true
        rua:
          type: string
          nullable: true
        numero:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        pfp:
          type: string
          format: uri
          nullable: true
        role:
          type: string
          enum:
            - USER
            - ADMIN
        accountStatus:
          type: string
          enum:
            - VERIFIED
            - UNVERIFIED

    CreateUserDto:
      type: object
      required:
        - email
        - password
        - name
        - phone
        - dob
      properties:
        email:
          type: string
          format: email
          example: "empreendedora@teste.com"
        password:
          type: string
          format: password
          example: "SenhaSegura123!"
        name:
          type: string
          example: "Maria da Silva"
        phone:
          type: string
          example: "(43) 99999-8888"
        dob:
          type: string
          example: "15/05/1995"
          description: "Formato DD/MM/AAAA"
        pfp:
          type: string
          format: uri
          description: "URL da foto de perfil"

    CreateAdminDto:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string

    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: "Maria Silva Santos"
        phone:
          type: string
          example: "(43) 99999-0000"
        occupation:
          type: string
          example: "Artesã"
        bio:
          type: string
          example: "Trabalho com bordados personalizados há 10 anos."
        pfp:
          type: string
          format: uri
          description: "URL da foto no Cloudinary"
        rua:
          type: string
          example: "Rua Principal"
        numero:
          type: string
          example: "500"
        bairro:
          type: string
          example: "Centro"
        cidade:
          type: string
          example: "Itambaracá"
        estado:
          type: string
          example: "PR"
