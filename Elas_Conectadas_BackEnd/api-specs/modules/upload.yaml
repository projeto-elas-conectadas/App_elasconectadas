paths:
  /upload/imagem:
    post:
      summary: Envia uma imagem para armazenamento
      operationId: UploadController_uploadImagem
      tags:
        - Uploads
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem a ser enviado
      responses:
        '201':
          description: Upload realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponseDto'
        '400':
          description: Erro de validação (arquivo ausente ou inválido)
          content:
            application/json:
              schema:
                $ref: '../shared/errors.yaml#/components/schemas/ErroPadrao'
        '401':
          description: Token JWT ausente ou inválido
          content:
            application/json:
              schema:
                $ref: '../shared/errors.yaml#/components/schemas/ErroPadrao'
        '500':
          description: Falha ao armazenar a imagem
          content:
            application/json:
              schema:
                $ref: '../shared/errors.yaml#/components/schemas/ErroPadrao'

components:
  schemas:
    UploadResponseDto:
      type: object
      required:
        - imageUrl
      properties:
        imageUrl:
          type: string
          format: uri
          description: URL segura da imagem armazenada no Cloudinary
