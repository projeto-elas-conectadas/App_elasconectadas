paths:
  /upload/imagem:
    post:
      operationId: UploadController_uploadImagem
      tags:
        - Uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem a ser enviado
      responses:
        '201':
          description: Upload realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponseDto'

components:
  schemas:
    UploadResponseDto:
      type: object
      required:
        - imageUrl
      properties:
        imageUrl:
          type: string
          format: uri
          description: URL segura da imagem armazenada no Cloudinary
