paths:
  /ads/create:
    post:
      summary: Cria um novo anúncio
      operationId: AdsController_createAd
      tags:
        - Ads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdDto'
      responses:
        '201':
          description: Anúncio criado
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Corpo inválido ou campos obrigatórios ausentes (title, content, type)
          content:
            application/json:
              schema:
                $ref: '../shared/errors.yaml#/components/schemas/ErroPadrao'

  /ads/list:
    get:
      summary: Lista todos os anúncios
      operationId: AdsController_getAllAds
      tags:
        - Ads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de anúncios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /ads/{id}:
    get:
      summary: Busca um anúncio por ID
      operationId: AdsController_getAdById
      tags:
        - Ads
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do anúncio
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Atualiza um anúncio existente
      operationId: AdsController_patchAd
      tags:
        - Ads
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdDto'
      responses:
        '200':
          description: Anúncio atualizado
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Corpo inválido (requestBody obrigatório; cover deve ser URI quando enviada)
          content:
            application/json:
              schema:
                $ref: '../shared/errors.yaml#/components/schemas/ErroPadrao'
    delete:
      summary: Remove um anúncio
      operationId: AdsController_deleteAdById
      tags:
        - Ads
      security:
        - bearerAuth: []
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Anúncio removido
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    CreateAdDto:
      type: object
      required:
        - title
        - content
        - type
      properties:
        title:
          type: string
          example: "Desconto de 20% no Dia das Mães"
        content:
          type: string
          example: "Aproveite nossa promoção especial para todos os serviços agendados nesta semana!"
        type:
          type: string
          example: "PRODUCT"
          description: "Valores aceitos: PRODUCT, SERVICE ou COLLAB"
        cover:
          type: string
          format: uri
          example: "https://res.cloudinary.com/demo/image/upload/v1/ads/capa-promo.jpg"
          description: "Link da imagem da capa no Cloudinary"

    UpdateAdDto:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          type: string
        cover:
          type: string
          format: uri