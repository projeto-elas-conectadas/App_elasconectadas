# auth.yaml CORRIGIDO — sugestão para enviar ao colega
paths:
  /login:
    post:
      operationId: AuthController_login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: Login efetuado com sucesso (Retorna Token)

  /send:
    post:
      operationId: AuthController_sendMail
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendEmailDto'
      responses:
        '201':
          description: E-mail enviado

  /request-otp:
    post:
      operationId: AuthController_requestOTP
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestTokenDto'
      responses:
        '201':
          description: OTP solicitado

  /verify-otp:
    post:
      operationId: AuthController_verifyOTP
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpDto'
      responses:
        '201':
          description: OTP verificado

components:
  schemas:
    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@elasconectadas.com"
        password:
          type: string
          format: password
          example: "Senha123!"

    sendEmailDto:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "usuario@teste.com"

    requestTokenDto:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    VerifyOtpDto:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          example: "123456"
          description: "Código de 6 dígitos recebido por e-mail"