# auth.yaml — CORRIGIDO
# Alterações feitas pelo front-end:
#   - /auth/login:       adicionado requestBody (LoginDto) e response (LoginResponseDto)
#   - sendEmailDto:      preenchido properties (antes estava vazio)
#   - requestTokenDto:   preenchido properties (antes estava vazio)
#   - VerifyOtpDto:      preenchido properties (antes estava vazio)
#
# ⚠️  Schemas preenchidos com base no comportamento observado do backend.
#      por favor valide se os campos e tipos estão corretos.

paths:
  /login:
    post:
      summary: Autentica a usuária e retorna o token JWT
      operationId: AuthController_login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: Login efetuado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '../shared/errors.yaml#/components/schemas/ErroPadrao'

  /send:
    post:
      summary: Envia um e-mail transacional
      operationId: AuthController_sendMail
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendEmailDto'
      responses:
        '201':
          description: E-mail enviado
          content:
            application/json:
              schema:
                type: object

  /request-otp:
    post:
      summary: Solicita um código OTP por e-mail
      operationId: AuthController_requestOTP
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestTokenDto'
      responses:
        '201':
          description: OTP solicitado
          content:
            application/json:
              schema:
                type: object

  /verify-otp:
    post:
      summary: Verifica o código OTP informado
      operationId: AuthController_verifyOTP
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpDto'
      responses:
        '201':
          description: OTP verificado
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "empreendedora@teste.com"
        password:
          type: string
          format: password
          example: "SenhaSegura123!"

    LoginResponseDto:
      type: object
      required:
        - access_token
        - user
      properties:
        access_token:
          type: string
          description: "Token JWT para autenticação"
        user:
          $ref: './users.yaml#/components/schemas/UserResponseDto'

    sendEmailDto:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "empreendedora@teste.com"
          description: "E-mail da destinatária"

    requestTokenDto:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "empreendedora@teste.com"

    VerifyOtpDto:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          example: "123456"
          description: "Código OTP recebido por e-mail"
