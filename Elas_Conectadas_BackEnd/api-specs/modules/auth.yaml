# auth.yaml CORRIGIDO — sugestão para enviar ao colega
paths:
  /auth/login:
    post:
      operationId: AuthController_login
      tags:
        - Auth
      requestBody:           # 👈 ADICIONADO
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: Login efetuado com sucesso
          content:           # 👈 ADICIONADO
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'

components:
  schemas:
    LoginDto:               # 👈 NOVO
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponseDto:       # 👈 NOVO
      type: object
      properties:
        access_token:
          type: string
        user:
          type: object

    requestTokenDto:        # 👈 CORRIGIDO (tinha properties vazio)
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyOtpDto:           # 👈 CORRIGIDO (tinha properties vazio)
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
        otp:
          type: string
